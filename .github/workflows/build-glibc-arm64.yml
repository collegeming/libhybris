name: Build libhybris (glibc aarch64) for XRing O3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config \
            libwayland-dev wayland-protocols libx11-dev libxcb1-dev libx11-xcb-dev \
            python3 git zstd

      - name: Fetch pinned upstream headers
        run: |
          set -euo pipefail
          headers=$(HYBRIS_DEPS_DIR="$RUNNER_TEMP/deps" bash tools/fetch-android-headers.sh)
          echo "ANDROID_HEADERS=$headers" >> "$GITHUB_ENV"
          git clone --depth 1 --branch vulkan-sdk-1.4.328.1 \
            https://github.com/KhronosGroup/Vulkan-Headers.git "$RUNNER_TEMP/vulkan-headers"
          git -C "$RUNNER_TEMP/vulkan-headers" rev-parse HEAD > "$RUNNER_TEMP/vulkan-headers-revision.txt"

      - name: Configure upstream graphics components
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/arlinux/graphics-protocols"
          export CPPFLAGS="-I$RUNNER_TEMP/vulkan-headers/include"
          export LDFLAGS="-Wl,--no-as-needed"
          cd hybris
          NOCONFIGURE=1 ./autogen.sh
          ./configure \
            --prefix=/usr/lib/hybris \
            --libdir=/usr/lib/hybris \
            --with-android-headers="$ANDROID_HEADERS" \
            --enable-arch=arm64 \
            --enable-wayland \
            --enable-x11 \
            --disable-wayland_serverside_buffers \
            --enable-adreno-quirks \
            --enable-mali-quirks \
            --enable-property-cache \
            --with-default-hybris-ld-library-path=/vendor/lib64/egl:/vendor/lib64/hw:/vendor/lib64:/system/lib64:/system_ext/lib64
          grep -q '^#define HAVE_VULKAN_VULKAN_H 1' config.h

      - name: Build and stage upstream graphics components
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/install"
          mkdir -p "$out"
          make -C hybris/common -j"$(nproc)" SUBDIRS=. libhybris-common.la
          make -C hybris/common install-libLTLIBRARIES DESTDIR="$out"
          make -C hybris/common/q -j"$(nproc)"
          make -C hybris/common/q install DESTDIR="$out"
          for dir in include properties libsync platforms hardware ui gralloc egl glesv1 glesv2 hwc2 vulkan utils; do
            make -C "hybris/$dir" -j"$(nproc)"
            make -C "hybris/$dir" install DESTDIR="$out"
          done

      - name: Verify and package installed tree
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/install"
          lib="$out/usr/lib/hybris"
          for file in libhybris-common.so.1 libhybris-vulkan-icd.so.0 \
              libVkLayer_hybris_compat.so libhybris/linker/q.so; do
            test -f "$lib/$file"
            readelf -h "$lib/$file" | grep 'Machine:.*AArch64'
          done
          readelf -d "$lib/libhybris-platformcommon.so.1" | grep 'libwayland-client.so.0'
          nm -D "$lib/libhybris-vulkan-icd.so.0" | grep ' vk_icdGetInstanceProcAddr$'
          mkdir -p "$out/build-info"
          git rev-parse HEAD > "$out/build-info/source-revision.txt"
          cp "$ANDROID_HEADERS/SOURCE_REVISION" "$out/build-info/android-headers.txt"
          cp "$RUNNER_TEMP/vulkan-headers-revision.txt" "$out/build-info/"
          cp hybris/config.log "$out/build-info/"
          tar --zstd -cf "$RUNNER_TEMP/libhybris-glibc-aarch64.tar.zst" -C "$out" .
          sha256sum "$RUNNER_TEMP/libhybris-glibc-aarch64.tar.zst" > "$RUNNER_TEMP/SHA256SUMS"

      - uses: actions/upload-artifact@v4
        with:
          name: libhybris-glibc-aarch64
          path: |
            ${{ runner.temp }}/libhybris-glibc-aarch64.tar.zst
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            hybris/config.log
            hybris/**/*.log
          retention-days: 7
